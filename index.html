<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma'lumotlar formasi</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  }
  
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  
  .form-container {
    background: white;
    border-radius: 20px;
    padding: 30px 25px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  
  h1 {
    text-align: center;
    color: #333;
    margin-bottom: 25px;
    font-size: 24px;
  }
  
  .form-group {
    margin-bottom: 18px;
  }
  
  label {
    display: block;
    margin-bottom: 6px;
    color: #555;
    font-weight: 600;
    font-size: 14px;
  }
  
  input, select {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 16px;
    transition: border-color 0.3s;
  }
  
  input:focus, select:focus {
    outline: none;
    border-color: #667eea;
  }
  
  button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: transform 0.2s;
  }
  
  button:active {
    transform: scale(0.97);
  }
  
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  
  .success-message {
    display: none;
    background: #4CAF50;
    color: white;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    margin-top: 15px;
    font-weight: 600;
  }
  
  .error-message {
    display: none;
    background: #f44336;
    color: white;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    margin-top: 15px;
    font-weight: 600;
  }
  
  .loading {
    display: none;
    text-align: center;
    color: #667eea;
    margin-top: 10px;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="form-container">
  <h1>📋 Ma'lumotlarni to'ldiring</h1>
  
  <form id="dataForm">
    <div class="form-group">
      <label>Ismingiz *</label>
      <input type="text" id="ism" required placeholder="Ismingizni kiriting">
    </div>
    
    <div class="form-group">
      <label>Familiyangiz *</label>
      <input type="text" id="familiya" required placeholder="Familiyangizni kiriting">
    </div>
    
    <div class="form-group">
      <label>Tug'ilgan sanangiz *</label>
      <input type="date" id="sana" required>
    </div>
    
    <div class="form-group">
      <label>Qaysi avtomobil markasi yoqadi? *</label>
      <select id="avtomobil" required>
        <option value="">Tanlang...</option>
        <option value="Chevrolet">Chevrolet</option>
        <option value="BMW">BMW</option>
        <option value="Mercedes-Benz">Mercedes-Benz</option>
        <option value="Toyota">Toyota</option>
        <option value="Lexus">Lexus</option>
        <option value="Audi">Audi</option>
        <option value="Kia">Kia</option>
        <option value="Hyundai">Hyundai</option>
        <option value="Boshqa">Boshqa</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>Sizga kim yoqadi? (ism)</label>
      <input type="text" id="yoqadigan" placeholder="Ismini kiriting">
    </div>
    
    <div class="form-group">
      <label>Sevimli faningiz *</label>
      <select id="fan" required>
        <option value="">Tanlang...</option>
        <option value="Matematika">Matematika</option>
        <option value="Fizika">Fizika</option>
        <option value="Kimyo">Kimyo</option>
        <option value="Biologiya">Biologiya</option>
        <option value="Ingliz tili">Ingliz tili</option>
        <option value="Tarix">Tarix</option>
        <option value="Informatika">Informatika</option>
        <option value="Ona tili">Ona tili</option>
        <option value="Boshqa">Boshqa</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>Oyoq kiyim razmeringiz *</label>
      <input type="number" id="razmer" required min="30" max="50" placeholder="Masalan: 42">
    </div>
    
    <button type="submit" id="submitBtn">Yuborish ✓</button>
    
    <div class="loading" id="loading">⏳ Yuborilmoqda...</div>
    <div class="success-message" id="successMsg">✅ Muvaffaqiyatli yuborildi!</div>
    <div class="error-message" id="errorMsg">❌ Xatolik yuz berdi. Qayta urinib ko'ring.</div>
  </form>
</div>

<script>
  // ⚠️ ВАЖНО: Вставьте сюда вашу ссылку из Apps Script
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby30gp3w5wFHueOtqRKnKH4jcRe7SeHmO_1eR_UhROa8aMSgT5wQ8GRiF4TEAV6cFBl/exec";

  document.getElementById('dataForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const loading = document.getElementById('loading');
    const successMsg = document.getElementById('successMsg');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');
    
    loading.style.display = 'block';
    successMsg.style.display = 'none';
    errorMsg.style.display = 'none';
    submitBtn.disabled = true;
    
    const data = {
      ism: document.getElementById('ism').value,
      familiya: document.getElementById('familiya').value,
      sana: document.getElementById('sana').value,
      avtomobil: document.getElementById('avtomobil').value,
      yoqadigan: document.getElementById('yoqadigan').value,
      fan: document.getElementById('fan').value,
      razmer: document.getElementById('razmer').value
    };
    
    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {
      loading.style.display = 'none';
      submitBtn.disabled = false;
      
      if (result.status === 'success') {
        successMsg.style.display = 'block';
        document.getElementById('dataForm').reset();
        
        setTimeout(() => {
          successMsg.style.display = 'none';
        }, 3000);
      } else {
        errorMsg.style.display = 'block';
      }
    })
    .catch(error => {
      loading.style.display = 'none';
      submitBtn.disabled = false;
      errorMsg.style.display = 'block';
      console.error('Xatolik:', error);
    });
  });
</script>

</body>
</html>
