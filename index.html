<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4a30">
<title>EkoSchool 153 — Рейтинг классов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g0:#062c1d;--g1:#0b4a30;--g2:#14804f;--g3:#34b36b;--mint:#e7f4ec;
  --gold:#c9a227;--gold2:#e6c24a;--bg:#f3f7f2;--card:#fff;--ink:#10261b;--mut:#5d7367;--line:#e0e9e1;--red:#c0392b;
  --r:20px;--sh:0 1px 2px rgba(11,74,48,.06),0 12px 32px rgba(11,74,48,.09);--sh2:0 2px 4px rgba(11,74,48,.08),0 24px 50px rgba(11,74,48,.18);
  --fs:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;font-size:var(--fs)}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
.wrap{width:min(1200px,92%);margin:0 auto}
.hidden{display:none!important}
section[id]{scroll-margin-top:84px}

/* ============ INTRO ============ */
#intro{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 40%,#0f6a43 0%,#0b4a30 55%,#062c1d 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .9s ease,visibility .9s}
#intro.hide{opacity:0;visibility:hidden}
.intro-stage{display:flex;flex-direction:column;align-items:center;gap:6px}
.leaves{position:relative;width:150px;height:150px;animation:lift 1s 3s cubic-bezier(.6,0,.2,1) forwards}
.leaves::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(8px);opacity:0;animation:glow 1.2s 2.6s ease-out forwards}
.leaf{position:absolute;left:50%;top:50%;width:84px;height:110px;margin:-60px 0 0 -42px;opacity:0;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.l1{animation:fall1 2.7s .1s cubic-bezier(.3,.6,.4,1) forwards}
.l2{animation:fall2 2.7s .4s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall1{
  0%{opacity:0;transform:translate(-48vw,-75vh) rotate(-260deg)}
  10%{opacity:1}
  40%{transform:translate(-18vw,-22vh) rotate(-110deg)}
  60%{transform:translate(8vw,-6vh) rotate(-5deg)}
  80%{transform:translate(-26px,4px) rotate(-40deg)}
  100%{opacity:1;transform:translate(-16px,0) rotate(-28deg)}
}
@keyframes fall2{
  0%{opacity:0;transform:translate(48vw,-75vh) rotate(260deg)}
  10%{opacity:1}
  40%{transform:translate(18vw,-22vh) rotate(110deg)}
  60%{transform:translate(-8vw,-6vh) rotate(5deg)}
  80%{transform:translate(26px,4px) rotate(40deg)}
  100%{opacity:1;transform:translate(16px,0) rotate(28deg)}
}
@keyframes glow{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(14)}}
@keyframes lift{to{transform:translateY(-8px) scale(.7)}}
.i-num{font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(72px,18vw,160px);line-height:1;color:#fff;letter-spacing:.02em;opacity:0;transform:translateY(24px) scale(.9);animation:numIn 1s 3.3s cubic-bezier(.2,.8,.2,1) forwards;margin-top:-30px}
@keyframes numIn{to{opacity:1;transform:none}}
.i-cap{font-family:'Unbounded',sans-serif;font-weight:400;font-size:clamp(14px,3.2vw,26px);color:#bfe8cf;letter-spacing:.2em;opacity:0;animation:capIn 1.4s 4.1s ease forwards}
@keyframes capIn{from{opacity:0;letter-spacing:.7em}to{opacity:1;letter-spacing:.38em}}
.i-line{width:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin-top:14px;animation:lineIn 1.2s 4.4s ease forwards}
@keyframes lineIn{to{width:min(300px,60vw)}}
.i-skip{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));color:#9fd2b6;font-size:.85rem;letter-spacing:.08em;padding:10px 18px;border:1px solid rgba(255,255,255,.25);border-radius:30px;opacity:0;animation:capIn .6s 1s forwards;transition:.2s}
.i-skip:hover{background:rgba(255,255,255,.1);color:#fff}

/* ============ BUTTONS / SMALL ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:14px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-weight:700;text-decoration:none;transition:.25s;box-shadow:0 8px 20px rgba(11,74,48,.25);white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(11,74,48,.32)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.6;pointer-events:none}
.btn.gold{background:linear-gradient(135deg,var(--gold2),#bf9418);color:#2a2000;box-shadow:0 8px 22px rgba(201,162,39,.4)}
.btn.ghost{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.2)}
.btn.sec2{background:#fff;color:var(--g1);border:1px solid var(--line);box-shadow:none}
.btn.sec2:hover{border-color:var(--g2);box-shadow:var(--sh)}
.btn.red{background:linear-gradient(135deg,#d14a3b,#a52f22);box-shadow:0 8px 20px rgba(192,57,43,.25)}
.btn.sm{padding:9px 16px;font-size:.86rem;border-radius:11px}
.btn.wide{width:100%}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.inp,.sel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:.2s;min-width:0;width:100%}
.inp:focus,.sel:focus{border-color:var(--g2);box-shadow:0 0 0 4px rgba(20,128,79,.14)}
textarea.inp{resize:vertical;min-height:90px}
.empty{padding:34px 20px;text-align:center;color:var(--mut);background:#fff;border:1px dashed #cfdcd1;border-radius:16px;font-weight:600}
.seg{display:inline-flex;background:#e4ece6;border-radius:15px;padding:4px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{padding:10px 20px;border-radius:12px;font-weight:700;font-size:.9rem;color:var(--mut);transition:.25s;white-space:nowrap;display:flex;align-items:center;gap:8px}
.seg button:hover{color:var(--g1)}
.seg button.on{background:#fff;color:var(--g1);box-shadow:0 2px 8px rgba(11,74,48,.14)}
.cnt{font-style:normal;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:.72rem;display:inline-grid;place-items:center;padding:0 6px}
.cnt.zero{background:#c9d6cc}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 16px;border-radius:30px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:.86rem;transition:.2s}
.chip:hover{border-color:var(--g2)}
.chip.on{background:var(--g1);color:#fff;border-color:var(--g1)}

/* avatar & rank badges */
.av{width:var(--s,44px);height:var(--s,44px);flex:none;border-radius:calc(var(--s,44px)*.3);display:grid;place-items:center;color:#fff;font-family:'Unbounded',sans-serif;font-weight:600;font-size:calc(var(--s,44px)*.28);background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));box-shadow:0 6px 14px rgba(0,0,0,.14);overflow:hidden;white-space:nowrap}
.rb{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:'Unbounded',sans-serif;font-weight:700;font-size:.82rem;color:#fff}
.rb.r1{background:linear-gradient(135deg,#f0cd55,#b8901a);box-shadow:0 4px 12px rgba(201,162,39,.5)}
.rb.r2{background:linear-gradient(135deg,#c4ccd2,#8a959d)}
.rb.r3{background:linear-gradient(135deg,#e0a77a,#a8683a)}
.rb.rx{background:#e4ece6;color:var(--mut)}

/* ============ HEADER ============ */
header.top{position:sticky;top:0;z-index:100;background:rgba(6,44,29,.82);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);color:#fff;border-bottom:1px solid rgba(255,255,255,.08);padding-top:env(safe-area-inset-top);transition:.3s}
header.top.sc{background:rgba(6,44,29,.96);box-shadow:0 8px 30px rgba(0,0,0,.2)}
.bar{display:flex;align-items:center;gap:18px;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Unbounded',sans-serif;font-weight:600;font-size:1rem;letter-spacing:.04em;white-space:nowrap;color:#fff;text-decoration:none}
.brand svg{width:28px;height:28px}
.brand b{color:var(--gold2)}
.brand i{font-style:normal;opacity:.7;font-weight:400}
nav.menu{margin-left:auto}
nav.menu ul{display:flex;gap:4px;list-style:none}
nav.menu a{color:#cfeadb;text-decoration:none;font-weight:700;font-size:.88rem;padding:9px 14px;border-radius:11px;transition:.2s;display:block}
nav.menu a:hover{background:rgba(255,255,255,.12);color:#fff}
nav.menu a.on{background:rgba(255,255,255,.16);color:#fff}
.tools{display:flex;align-items:center;gap:8px}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:11px;padding:3px}
.lang button{color:#cfeadb;font-weight:800;font-size:.78rem;padding:6px 10px;border-radius:8px;transition:.2s}
.lang button.on{background:#fff;color:var(--g1)}
.ibtn{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:1.05rem;transition:.2s;color:#fff;position:relative}
.ibtn:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
.ibtn.off{opacity:.5}
.ibtn .cnt{position:absolute;right:-5px;top:-6px;min-width:18px;height:18px;font-size:.66rem;padding:0 4px}

/* ============ HERO ============ */
.hero{position:relative;color:#fff;overflow:hidden;padding:80px 0 150px;background:
  radial-gradient(900px 500px at 88% -10%,rgba(230,194,74,.28),transparent 60%),
  radial-gradient(700px 520px at 0% 105%,rgba(52,179,107,.38),transparent 60%),
  linear-gradient(135deg,#062c1d 0%,#0b4a30 50%,#14804f 100%)}
.hero::after{content:"153";position:absolute;right:-2%;bottom:-10%;font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(160px,32vw,460px);line-height:1;color:rgba(255,255,255,.045);pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.fl{position:absolute;width:40px;opacity:.14;animation:drift linear infinite;z-index:0}
@keyframes drift{0%{transform:translate(0,-60px) rotate(0)}100%{transform:translate(60px,110vh) rotate(360deg)}}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid rgba(255,255,255,.28);border-radius:30px;font-size:.8rem;font-weight:700;letter-spacing:.04em;background:rgba(255,255,255,.08);margin-bottom:22px}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold2);box-shadow:0 0 0 4px rgba(230,194,74,.25);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(230,194,74,0)}}
.hero h1{font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(1.8rem,4.8vw,3.5rem);line-height:1.12;max-width:860px}
.hero h1 span{background:linear-gradient(90deg,var(--gold2),#fff3c0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{margin-top:18px;max-width:640px;color:#cfeadb;font-size:1.05rem}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:44px}
.stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:18px 20px;backdrop-filter:blur(6px);transition:.3s}
.stat:hover{transform:translateY(-4px);background:rgba(255,255,255,.14)}
.stat b{display:block;font-family:'Unbounded',sans-serif;font-size:clamp(1.4rem,3vw,2.1rem);font-weight:600}
.stat span{font-size:.82rem;color:#bfe8cf}

/* ============ SECTIONS ============ */
section.sec{padding:72px 0}
.sec h2{font-family:'Unbounded',sans-serif;font-size:clamp(1.35rem,2.8vw,2rem);font-weight:600;line-height:1.2}
.sec .lead{color:var(--mut);margin:10px 0 26px;max-width:680px}
.head-row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:26px}
.head-row .lead{margin:8px 0 0}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease}
.reveal.in{opacity:1;transform:none}

/* leaders */
#leaders{margin-top:-96px;position:relative;z-index:2;padding:0 0 10px}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.lcard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh2);padding:22px;display:flex;flex-direction:column;gap:10px;transition:.3s;border:1px solid rgba(255,255,255,.7)}
.lcard:hover{transform:translateY(-5px)}
.lh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.lh .ic{width:44px;height:44px;border-radius:14px;background:var(--mint);display:grid;place-items:center;font-size:1.25rem}
.lh b{display:block;font-family:'Unbounded',sans-serif;font-size:1rem;font-weight:600}
.lh small{color:var(--mut);font-size:.78rem}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;cursor:pointer;transition:.2s;background:var(--bg)}
.lrow:hover{background:var(--mint)}
.lrow.first{background:linear-gradient(135deg,#fff9e3,#fff1c2);border:1px solid #efd98a;padding:15px 14px}
.lrow .nm{font-weight:800;min-width:0}
.lrow.first .nm{font-size:1.15rem}
.lrow .pv{margin-left:auto;font-weight:800;color:var(--g1);text-align:right;line-height:1.1}
.lrow .pv small{display:block;font-size:.68rem;color:var(--mut);font-weight:600}
.lrow.first .pv{font-size:1.3rem}

/* rating list */
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px}
.ctrl .inp{margin-left:auto;width:250px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:36px 50px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 20px 14px 16px;cursor:pointer;transition:.25s;position:relative}
.row:hover{transform:translateX(5px);box-shadow:var(--sh);border-color:var(--g3)}
.row.t1{border-color:#efd98a;background:linear-gradient(90deg,#fffbea,#fff 40%)}
.row.mine{border-color:var(--g2);box-shadow:0 0 0 3px rgba(20,128,79,.14)}
.row .nm{font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.you{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--g2);color:#fff;border-radius:20px;padding:2px 9px}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chips2 span{font-size:.72rem;font-weight:700;color:var(--mut);background:var(--bg);border-radius:20px;padding:2px 9px}
.row .bar2{height:7px;background:#e7efe8;border-radius:5px;margin-top:9px;overflow:hidden}
.row .bar2 i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--g2),var(--g3));width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.row .pt{text-align:right;font-weight:800;font-size:1.25rem;color:var(--g1);line-height:1.1}
.row .pt small{display:block;font-size:.7rem;color:var(--mut);font-weight:600}
.fadeup{animation:fadeUp .55s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* my class */
#my{background:linear-gradient(180deg,#e9f1ea,#f3f7f2)}
.mypick{max-width:520px;margin:0 auto;background:#fff;border-radius:var(--r);padding:34px;text-align:center;box-shadow:var(--sh);border:1px solid var(--line)}
.mp-ic{width:70px;height:70px;border-radius:22px;background:var(--mint);display:grid;place-items:center;font-size:2rem;margin:0 auto 14px}
.mypick h3{font-family:'Unbounded',sans-serif;font-size:1.15rem;margin-bottom:6px}
.mypick p{color:var(--mut);margin-bottom:18px}
.inline{display:flex;gap:10px}
.mycard{display:grid;grid-template-columns:minmax(260px,.8fr) 1.6fr;gap:22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--sh)}
.panel h3{font-family:'Unbounded',sans-serif;font-size:1.02rem;font-weight:600;margin-bottom:16px}
.my-l{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff;border:0}
.my-l h3{font-size:1.9rem;margin:0}
.my-l .eyebrow{color:var(--gold2);margin:8px 0 0}
.my-l .acts{margin-top:10px;justify-content:center}
.my-l .btn.sec2{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:var(--bg);border-radius:16px;padding:14px;text-align:center;transition:.25s}
.tile:hover{background:var(--mint);transform:translateY(-3px)}
.tile small{display:block;font-size:.72rem;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tile b{display:block;font-family:'Unbounded',sans-serif;font-size:1.5rem;color:var(--g1);margin:2px 0}
.tile span{font-size:.78rem;color:var(--mut);font-weight:600}
.gap{display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px 16px;border-radius:14px;background:#fffaf0;border:1px solid #efdda0;font-weight:700;font-size:.92rem}
.gap .ic{font-size:1.4rem}
.prog{margin-top:14px}
.prog .pt2{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:.88rem;margin-bottom:8px}
.prog .pt2 span:last-child{color:var(--g2)}
.prog .pb{height:12px;background:#e4ece6;border-radius:8px;overflow:hidden}
.prog .pb i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.prog small{display:block;margin-top:8px;color:var(--mut);font-weight:600}
.mythumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.mythumbs .card{border-radius:14px}

/* gallery */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);border:1px solid var(--line);cursor:pointer;transition:.3s;position:relative}
.card:hover{transform:translateY(-6px);box-shadow:var(--sh2)}
.card .im{aspect-ratio:4/3;background:#dfeae2;position:relative;overflow:hidden}
.card .im img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .im img{transform:scale(1.07)}
.card .cb{position:absolute;left:10px;top:10px;background:rgba(6,44,29,.88);backdrop-filter:blur(4px);color:#fff;font-weight:800;font-size:.78rem;padding:5px 12px;border-radius:20px}
.card .sc{position:absolute;right:10px;top:10px;background:linear-gradient(135deg,var(--gold2),#bf9418);color:#2a2000;font-weight:800;font-size:.78rem;padding:5px 12px;border-radius:20px}
.card .tt{padding:14px 16px;font-weight:700;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card .tt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{width:34px;height:34px;border-radius:50%;background:var(--gold2);flex:none;display:none;place-items:center;transition:.2s}
.star:hover{transform:scale(1.15) rotate(15deg)}
body.is-admin .star{display:grid}
.more{display:flex;margin:28px auto 0}

/* feed */
.feed{display:flex;flex-direction:column;gap:10px}
.fi{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;animation:fadeUp .6s both;transition:.2s}
.fi:hover{border-color:var(--g3)}
.fi .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--mint);font-size:1.2rem;flex:none}
.fi .tx{flex:1;min-width:0}
.fi .tx b{font-weight:800}
.fi .tx div{font-size:.88rem;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.fi .dt{font-size:.78rem;color:var(--mut);white-space:nowrap}
.fi .pp{font-weight:800;color:var(--g2)}
.fi .pp.neg{color:var(--red)}

/* admin */
.admin-only{display:none}
body.is-admin .admin-only{display:block}
#admin{background:#e9f1ea}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.form label{font-size:.78rem;font-weight:800;color:var(--mut);display:block;margin-bottom:6px}
.mini{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto}
.mi{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:12px;font-size:.9rem}
.mi .g{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mi .g small{color:var(--mut);display:block;font-weight:500}
.x{width:30px;height:30px;border-radius:8px;color:var(--red);font-weight:800;flex:none;transition:.2s}
.x:hover{background:#fbe5e2}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tag{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:20px;padding:5px 6px 5px 14px;font-weight:700;font-size:.88rem}
.tag .x{width:24px;height:24px}
.tabpane{margin-top:22px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;animation:fadeUp .5s both}
.pim{aspect-ratio:16/10;position:relative;cursor:pointer;background:#dfeae2;overflow:hidden}
.pim img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.pim:hover img{transform:scale(1.05)}
.pim .cb{position:absolute;left:10px;top:10px;background:rgba(6,44,29,.88);color:#fff;font-weight:800;font-size:.78rem;padding:5px 12px;border-radius:20px}
.pb2{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.pb2 b{font-size:1.02rem}
.pb2 p{color:var(--mut);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pb2 small{color:var(--mut);font-weight:600}
.pb2 .acts{margin-top:auto;padding-top:10px}
.note{font-size:.85rem;color:var(--mut);margin-top:12px}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;font-size:.92rem;margin-top:4px}
.chk input{width:20px;height:20px;accent-color:var(--g2)}
.exbox{margin-top:14px;padding:14px 16px;background:#fffaf0;border:1px solid #efdda0;border-radius:14px;font-weight:700}

/* modal */
.modal{position:fixed;inset:0;z-index:500;background:rgba(6,30,20,.62);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:.3s}
.modal.open{opacity:1;visibility:visible}
.mbox{background:var(--card);border-radius:24px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:32px;position:relative;transform:translateY(20px) scale(.97);transition:.35s cubic-bezier(.2,.8,.2,1);box-shadow:var(--sh2)}
.modal.open .mbox{transform:none}
.mbox.wide{width:min(920px,100%)}
.mx{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;background:var(--bg);font-size:1.05rem;transition:.2s;z-index:3}
.mx:hover{background:var(--line);transform:rotate(90deg)}
.mbox h3{font-family:'Unbounded',sans-serif;font-size:1.2rem;margin-bottom:6px;padding-right:40px}
.mbox .sub{color:var(--mut);margin-bottom:18px}
.big{width:100%;border-radius:16px;max-height:60vh;object-fit:contain;background:#0c1f16;margin-bottom:16px}
.crit{margin:16px 0}
.crit .top2{display:flex;justify-content:space-between;font-weight:700;font-size:.92rem;margin-bottom:6px;gap:10px}
.crit output{color:var(--g2);font-weight:800;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--g2);height:6px}
.sum{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#fffaf0;border:1px solid #ecd9a0;border-radius:14px;margin:18px 0;font-weight:800}
.sum b{font-family:'Unbounded',sans-serif;color:#a07a0c;font-size:1.25rem}
.bd{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.bd div{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.88rem;font-weight:600}
.bd i{grid-column:1/-1;height:7px;background:#e7efe8;border-radius:4px;overflow:hidden}
.bd i s{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g3))}

/* send modal */
.drop{border:2px dashed #b9cdbe;border-radius:18px;background:var(--bg);cursor:pointer;transition:.2s;overflow:hidden}
.drop:hover,.drop.over{border-color:var(--g2);background:var(--mint)}
.dz{padding:30px 16px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.dzi{font-size:2.2rem}
.dz small{color:var(--mut)}
.pvw{position:relative}
.pvw img{width:100%;max-height:300px;object-fit:cover}
.pvx{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff}
.cnt2{text-align:right;font-size:.75rem;color:var(--mut);margin-top:4px}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.done{text-align:center;padding:10px 0}
.done svg{width:90px;height:90px;margin-bottom:10px}
.done circle{stroke:var(--g3);stroke-width:4;fill:none;stroke-dasharray:166;stroke-dashoffset:166;animation:dash .7s .1s forwards}
.done path{stroke:var(--g2);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:48;stroke-dashoffset:48;animation:dash .5s .7s forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.done h3{padding:0}
.done p{color:var(--mut);margin:8px 0 22px}

/* profile */
.pf-head{display:flex;align-items:center;gap:20px;margin-bottom:22px}
.pf-head h3{font-size:1.8rem;margin:0;padding:0}
.pf-head .sub{margin:2px 0 0}
.bars2{display:flex;flex-direction:column;gap:12px;margin:8px 0 24px}
.bars2 .b{display:grid;grid-template-columns:130px 1fr 60px;gap:12px;align-items:center;font-size:.88rem;font-weight:700}
.bars2 .b i{height:10px;background:#e4ece6;border-radius:6px;overflow:hidden;display:block}
.bars2 .b i s{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--g2),var(--g3))}
.bars2 .b em{font-style:normal;text-align:right;color:var(--g1)}
.sech{font-family:'Unbounded',sans-serif;font-size:.95rem;font-weight:600;margin:24px 0 12px}
.wk{display:flex;align-items:flex-end;gap:8px;height:140px;padding:10px 4px 0}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:.7rem;color:var(--mut);font-weight:700}
.wk s{display:block;width:100%;max-width:44px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--g3),var(--g2));min-height:3px;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.wk s.neg{background:linear-gradient(180deg,#e0685b,var(--red))}
.wk b{color:var(--g1);font-size:.72rem}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.bdg{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#fff9e3,#fff1c2);border:1px solid #efd98a;border-radius:30px;padding:8px 16px 8px 10px;font-weight:800;font-size:.85rem}
.bdg span{font-size:1.2rem}
.mini.hist{max-height:240px}
.pgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pgal .card{border-radius:14px}

/* misc */
.setup{background:#fffaf0;border:1px solid #ecd9a0;border-radius:var(--r);padding:30px;margin:30px 0}
.setup h3{margin-bottom:10px;font-family:'Unbounded',sans-serif}
.setup code{background:#f3e8c4;padding:2px 8px;border-radius:6px;word-break:break-all}
.err{background:#fdecea;border:1px solid #f3b9b2;color:#8f2418;padding:14px 18px;border-radius:12px;margin:20px 0;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--g1);color:#fff;padding:13px 24px;border-radius:30px;font-weight:700;z-index:900;opacity:0;transition:.35s;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--red)}
footer{background:var(--g0);color:#9fd2b6;padding:40px 0 calc(32px + env(safe-area-inset-bottom));text-align:center;font-size:.9rem;position:relative}
footer::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(#0099b5 0 33%,#ce1126 33% 36%,#fff 36% 64%,#ce1126 64% 67%,#1eb53a 67%)}
footer b{color:#fff;font-family:'Unbounded',sans-serif;font-weight:600;letter-spacing:.06em}
.skeleton{height:78px;border-radius:18px;background:linear-gradient(90deg,#e6eee8 25%,#f3f8f4 50%,#e6eee8 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ============ RESPONSIVE ============ */
@media (min-width:1921px){html{--fs:19px}.wrap{width:min(1500px,88%)}}
@media (min-width:2560px){html{--fs:23px}.wrap{width:min(1800px,86%)}}
@media (min-width:3200px){html{--fs:30px}.wrap{width:min(2400px,84%)}}
@media (max-width:1100px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .lgrid{grid-template-columns:1fr}
  .mycard{grid-template-columns:1fr}
  .ag{grid-template-columns:1fr}
  #leaders{margin-top:-80px}
}
@media (max-width:820px){
  .bar{flex-wrap:wrap;height:auto;padding:10px 0;gap:10px}
  .tools{margin-left:auto}
  nav.menu{order:3;width:100%;margin:0;overflow-x:auto}
  nav.menu ul{width:max-content}
  .hero{padding:52px 0 120px}
  section.sec{padding:52px 0}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .ctrl .inp{margin-left:0;width:100%}
  .mythumbs{grid-template-columns:repeat(2,1fr)}
  .bars2 .b{grid-template-columns:100px 1fr 50px}
}
@media (max-width:560px){
  .brand{font-size:.85rem}
  .brand i{display:none}
  .stats{gap:10px}.stat{padding:14px}
  .row{grid-template-columns:30px 42px 1fr auto;padding:12px;gap:10px}
  .row .chips2{display:none}
  .rb{width:30px;height:30px;font-size:.72rem}
  .form{grid-template-columns:1fr}
  .panel{padding:20px}
  .mbox{padding:24px 18px;border-radius:20px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .card .tt{padding:10px 12px;font-size:.85rem}
  .fi{padding:12px}.fi .dt{display:none}
  .inline{flex-direction:column}
  .pf-head h3{font-size:1.4rem}
  .pf-head .av{--s:64px!important}
  .pgrid{grid-template-columns:1fr}
  .seg button{padding:9px 13px;font-size:.84rem}
  .cta .btn{flex:1}
  .my-l h3{font-size:1.5rem}
}
@media (max-width:360px){
  html{--fs:14px}
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
}
@media (max-height:500px) and (orientation:landscape){
  .hero{padding:30px 0 90px}
  section.sec{padding:34px 0}
  .leaves{transform:scale(.6)}
  .i-num{font-size:70px;margin-top:-40px}
  .modal{align-items:flex-start}
  .mbox{max-height:96vh}
}
@media (hover:none){
  .row:hover,.card:hover,.stat:hover,.lcard:hover,.tile:hover{transform:none}
  .card:hover .im img{transform:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .reveal{opacity:1;transform:none}
}
@media print{
  #intro,header.top,.tools,.ctrl,.admin-only,.star,#toast,.fl,.more,.cta{display:none!important}
  body{background:#fff}
  .hero{background:#fff;color:#000;padding:20px 0}
  .hero h1,.hero p.sub,.stat b,.stat span{color:#000;-webkit-text-fill-color:#000}
  #leaders{margin-top:0}
  .reveal{opacity:1;transform:none}
  section.sec{padding:20px 0;break-inside:avoid}
}
</style>
</head>
<body>

<!-- ============ INTRO ============ -->
<div id="intro">
  <div class="intro-stage">
    <div class="leaves">
      <svg class="leaf l1" viewBox="0 0 100 130"><defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7be3a4"/><stop offset="1" stop-color="#1f9d5c"/></linearGradient></defs><path d="M50 2C92 34 94 88 50 128C6 88 8 34 50 2Z" fill="url(#lg1)"/><path d="M50 14V124M50 50L72 38M50 74L28 62M50 96L70 84" stroke="#0b4a30" stroke-opacity=".55" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
      <svg class="leaf l2" viewBox="0 0 100 130"><defs><linearGradient id="lg2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46c27b"/><stop offset="1" stop-color="#0d6b40"/></linearGradient></defs><path d="M50 2C92 34 94 88 50 128C6 88 8 34 50 2Z" fill="url(#lg2)"/><path d="M50 14V124M50 50L28 38M50 74L72 62M50 96L30 84" stroke="#052c1c" stroke-opacity=".5" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
    </div>
    <div class="i-num">153</div>
    <div class="i-cap">EKOSCHOOL</div>
    <div class="i-line"></div>
  </div>
  <button class="i-skip" id="skip" data-i18n="skip"></button>
</div>

<!-- ============ HEADER ============ -->
<header class="top" id="hdr">
  <div class="wrap bar">
    <a class="brand" href="#top">
      <svg viewBox="0 0 100 130"><path d="M50 2C92 34 94 88 50 128C6 88 8 34 50 2Z" fill="#34b36b"/><path d="M50 14V124" stroke="#062c1d" stroke-width="5"/></svg>
      <span>EKO<b>SCHOOL</b> <i>153</i></span>
    </a>
    <nav class="menu"><ul id="menu">
      <li><a href="#leaders" data-i18n="nav_leaders"></a></li>
      <li><a href="#rating" data-i18n="nav_rating"></a></li>
      <li><a href="#my" data-i18n="nav_my"></a></li>
      <li><a href="#projects" data-i18n="nav_projects"></a></li>
      <li><a href="#activity" data-i18n="nav_activity"></a></li>
    </ul></nav>
    <div class="tools">
      <button class="btn gold sm js-send" data-i18n="send_short"></button>
      <div class="lang"><button data-lang="ru">RU</button><button data-lang="uz">UZ</button></div>
      <button class="ibtn" id="snd" title="Sound">🔊</button>
      <button class="ibtn" id="adm" title="Admin">🔐<em class="cnt hidden" id="admBadge">0</em></button>
    </div>
  </div>
</header>

<main id="top">
<div class="wrap" id="msgbox"></div>

<!-- ============ HERO ============ -->
<div class="hero">
  <svg class="fl" style="left:8%;animation-duration:22s" viewBox="0 0 100 130"><path d="M50 2C92 34 94 88 50 128C6 88 8 34 50 2Z" fill="#fff"/></svg>
  <svg class="fl" style="left:35%;animation-duration:30s;animation-delay:-8s;width:28px" viewBox="0 0 100 130"><path d="M50 2C92 34 94 88 50 128C6 88 8 34 50 2Z" fill="#fff"/></svg>
  <svg class="fl" style="left:62%;animation-duration:26s;animation-delay:-14s;width:52px" viewBox="0 0 100 130"><path d="M50 2C92 34 94 88 50 128C6 88 8 34 50 2Z" fill="#fff"/></svg>
  <svg class="fl" style="left:86%;animation-duration:34s;animation-delay:-3s;width:34px" viewBox="0 0 100 130"><path d="M50 2C92 34 94 88 50 128C6 88 8 34 50 2Z" fill="#fff"/></svg>
  <div class="wrap">
    <div class="badge" data-i18n="hero_badge"></div>
    <h1 data-i18n-html="hero_title"></h1>
    <p class="sub" data-i18n="hero_sub"></p>
    <div class="cta">
      <button class="btn gold js-send" data-i18n="send"></button>
      <a class="btn ghost" href="#my" data-i18n="hero_my"></a>
    </div>
    <div class="stats">
      <div class="stat"><b id="s1">0</b><span data-i18n="st_classes"></span></div>
      <div class="stat"><b id="s2">0</b><span data-i18n="st_points"></span></div>
      <div class="stat"><b id="s3">0</b><span data-i18n="st_projects"></span></div>
      <div class="stat"><b id="s4">0</b><span data-i18n="st_week"></span></div>
    </div>
  </div>
</div>

<!-- ============ LEADERS ============ -->
<section id="leaders"><div class="wrap">
  <div class="lgrid" id="leaderCards"></div>
</div></section>

<!-- ============ RATING ============ -->
<section class="sec" id="rating"><div class="wrap">
  <div class="reveal">
    <div class="head-row">
      <div>
        <div class="eyebrow" data-i18n="nav_rating"></div>
        <h2 data-i18n="rating_t"></h2>
        <p class="lead" data-i18n="rating_s"></p>
      </div>
      <div class="seg" id="perTabs">
        <button data-p="week" data-i18n="p_week"></button>
        <button data-p="month" data-i18n="p_month"></button>
        <button data-p="year" data-i18n="p_year"></button>
        <button data-p="all" class="on" data-i18n="p_all"></button>
      </div>
    </div>
    <div class="ctrl">
      <div class="chips" id="gradeChips"></div>
      <input class="inp" id="search" data-i18n-ph="search" autocomplete="off">
    </div>
    <div class="list" id="list"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  </div>
</div></section>

<!-- ============ MY CLASS ============ -->
<section class="sec" id="my"><div class="wrap">
  <div class="reveal">
    <div class="eyebrow" data-i18n="nav_my"></div>
    <h2 data-i18n="my_t"></h2>
    <p class="lead" data-i18n="my_s"></p>
    <div id="myBox"></div>
  </div>
</div></section>

<!-- ============ PROJECTS ============ -->
<section class="sec" id="projects"><div class="wrap">
  <div class="reveal">
    <div class="head-row">
      <div>
        <div class="eyebrow" data-i18n="nav_projects"></div>
        <h2 data-i18n="proj_t"></h2>
        <p class="lead" data-i18n="proj_s"></p>
      </div>
      <button class="btn gold js-send" data-i18n="send"></button>
    </div>
    <div class="ctrl">
      <div class="chips" id="sortChips">
        <button class="chip on" data-sort="new" data-i18n="sort_new"></button>
        <button class="chip" data-sort="best" data-i18n="sort_best"></button>
      </div>
      <select class="sel" id="galClass" style="margin-left:auto;width:220px"></select>
    </div>
    <div class="grid" id="grid"></div>
    <button class="btn sec2 more hidden" id="more" data-i18n="more"></button>
  </div>
</div></section>

<!-- ============ ACTIVITY ============ -->
<section class="sec" id="activity" style="padding-top:20px"><div class="wrap">
  <div class="reveal">
    <div class="eyebrow" data-i18n="nav_activity"></div>
    <h2 data-i18n="act_t"></h2>
    <div class="feed" id="feed" style="margin-top:24px"></div>
  </div>
</div></section>

<!-- ============ ADMIN ============ -->
<section class="sec admin-only" id="admin"><div class="wrap">
  <div class="eyebrow">ADMIN</div>
  <h2 data-i18n="admin_t"></h2>
  <div class="seg" id="admTabs" style="margin-top:22px">
    <button data-tab="pending" class="on"><span data-i18n="tab_pending"></span><em class="cnt zero" id="pcnt">0</em></button>
    <button data-tab="points" data-i18n="tab_points"></button>
    <button data-tab="classes" data-i18n="tab_classes"></button>
    <button data-tab="criteria" data-i18n="tab_criteria"></button>
    <button data-tab="rules" data-i18n="tab_rules"></button>
  </div>

  <div class="tabpane" id="tab-pending"><div class="pgrid" id="pendList"></div></div>

  <div class="tabpane hidden" id="tab-points"><div class="ag">
    <div class="panel">
      <h3 data-i18n="a_add"></h3>
      <form class="form" id="fRes">
        <div><label data-i18n="f_class"></label><select class="sel" id="rClass" required></select></div>
        <div><label data-i18n="f_task"></label><input class="inp" id="rTask" list="taskList" maxlength="120" required><datalist id="taskList"></datalist></div>
        <div><label data-i18n="f_points"></label><input class="inp" id="rPts" type="number" step="1" min="-1000" max="1000" required></div>
        <div><label data-i18n="f_comment"></label><input class="inp" id="rCom" maxlength="200"></div>
        <button class="btn full" type="submit" data-i18n="f_save"></button>
      </form>
    </div>
    <div class="panel">
      <h3 data-i18n="a_last"></h3>
      <div class="mini" id="lastRes"></div>
    </div>
  </div></div>

  <div class="tabpane hidden" id="tab-classes"><div class="panel" style="max-width:640px">
    <h3 data-i18n="a_classes"></h3>
    <form class="inline" id="fClass"><input class="inp" id="cName" data-i18n-ph="a_class_ph" maxlength="20" required><button class="btn" type="submit" data-i18n="add"></button></form>
    <div class="tags" id="clsTags"></div>
  </div></div>

  <div class="tabpane hidden" id="tab-criteria"><div class="panel" style="max-width:720px">
    <h3 data-i18n="a_criteria"></h3>
    <div class="mini" id="critList" style="margin-bottom:16px"></div>
    <form class="form" id="fCrit">

let soundOn=localStorage.getItem('eco_snd')!=='0',actx;
function click(){
  if(!soundOn)return;
  try{
    actx=actx||new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const T=actx.currentTime;
    [[880,0],[1318,.045]].forEach(([f,d])=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,T+d);g.gain.linearRampToValueAtTime(.11,T+d+.008);g.gain.exponentialRampToValueAtTime(.0001,T+d+.2);
      o.connect(g);g.connect(actx.destination);o.start(T+d);o.stop(T+d+.22);
    });
  }catch(e){}
}
document.addEventListener('click',click,true);

const D={settings:{actPerProject:2,weekMin:3,weekBonus:5,qualityInRating:true},classes:[],tasks:[],results:[],criteria:[],projects:[],bonuses:[],ranking:{week:[],month:[],year:[],all:[]},pending:[]};

let myCls=localStorage.getItem('eco_my')||'';
let period='all',gradeF=0,query='',sortM='new',galCls='',shown=PAGE;

function norm(d){
  D.settings=d.settings||D.settings;
  D.classes=(d.classes||[]);
  D.tasks=d.tasks||[];
  D.results=d.results||[];
  D.criteria=d.criteria||[];
  D.projects=d.projects||[];
  D.bonuses=d.bonuses||[];
  D.ranking=d.ranking||D.ranking;
  if(myCls&&!D.classes.some(c=>c.name===myCls)){myCls='';localStorage.removeItem('eco_my')}
}
const E=(p,name)=>(D.ranking[p]||[]).find(x=>x.name===name);
async function load(){
  if(NO_API)return;
  try{
    const r=await fetch(API_URL+'?t='+Date.now());
    const d=await r.json();
    if(!d.ok)throw new Error(d.error);
    norm(d);$('#msgbox').innerHTML='';
    if(token)await loadPending(true);
    render();
  }catch(e){
    const box=$('#msgbox');box.innerHTML='';
    if(!D.classes.length)box.append(h('div',{class:'err',text:t('load_err')}));
  }
}
async function loadPending(quiet){
  try{const j=await api('pending');D.pending=j.items||[]}catch(e){if(!quiet)throw e}
}
async function api(action,data={}){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token,...data})});
  const j=await r.json();
  if(!j.ok){
    if(j.code==='auth')logout(true);
    throw new Error(j.error||t('err'));
  }
  return j;
}
async function act(fn,okMsg){
  try{await fn();toast(okMsg||t('saved'));await load();return true}
  catch(e){toast(e.message||t('err'),true);return false}
}

/* ---- профиль класса ---- */
function monday(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function weekly(cls,n){
  const base=monday(new Date()),arr=[];
  for(let i=n-1;i>=0;i--){const s=new Date(base);s.setDate(s.getDate()-7*i);arr.push({start:s,pts:0})}
  const add=(date,pts)=>{const m=monday(date).getTime(),w=arr.find(a=>a.start.getTime()===m);if(w)w.pts+=pts};
  D.results.filter(r=>r.cls===cls).forEach(r=>add(new Date(r.date),r.points));
  D.projects.filter(p=>p.cls===cls).forEach(p=>add(new Date(p.date),(D.settings.qualityInRating?p.total:0)+num(D.settings.actPerProject)));
  D.bonuses.filter(b=>b.cls===cls).forEach(b=>add(new Date(b.date),b.points));
  return arr;
}
function openClass(name){
  const c=D.classes.find(x=>x.name===name);if(!c)return;
  const body=$('#pfBody');body.innerHTML='';
  const all=E('all',name)||{total:0,tasks:0,quality:0,activity:0,rank:0};
  body.append(h('div',{class:'pf-head'},av(name,84),h('div',{},
    h('div',{class:'eyebrow',text:t('prof')}),h('h3',{text:name}),
    h('div',{class:'sub',text:all.total>0?'#'+all.rank+' · '+fmt(all.total)+' '+t('pts'):t('empty')}))));
  body.append(h('div',{class:'tiles'},['week','month','year','all'].map(p=>{
    const x=E(p,name)||{total:0,rank:0};
    return h('div',{class:'tile'},h('small',{text:t('p_'+p)}),h('b',{text:x.total>0?'#'+x.rank:'–'}),h('span',{text:fmt(x.total)+' '+t('pts')}));
  })));
  // из чего складываются
  body.append(h('h4',{class:'sech',text:t('prof_break')}));
  const parts=[[t('tasks_s'),all.tasks],[t('quality_s'),all.quality],[t('activity_s'),all.activity]];
  const mx=Math.max(1,...parts.map(x=>Math.abs(x[1])));
  body.append(h('div',{class:'bars2'},parts.map(([l,v])=>h('div',{class:'b'},h('span',{text:l}),h('i',{},h('s',{style:`width:${Math.abs(v)/mx*100}%`})),h('em',{text:fmt(v)})))));
  // недели
  body.append(h('h4',{class:'sech',text:t('prof_weeks')}));
  const wk=weekly(name,8),wm=Math.max(1,...wk.map(w=>Math.abs(w.pts)));
  body.append(h('div',{class:'wk'},wk.map(w=>h('div',{},h('b',{text:w.pts?fmt(w.pts):''}),
    h('s',{class:w.pts<0?'neg':'',style:`height:${Math.abs(w.pts)/wm*100*0.8}%`}),
    h('span',{text:String(w.start.getDate()).padStart(2,'0')+'.'+String(w.start.getMonth()+1).padStart(2,'0')})))));
  // достижения
  body.append(h('h4',{class:'sech',text:t('prof_badges')}));
  const lead=p=>{const f=(D.ranking[p]||[])[0];return f&&f.total>0&&f.name===name};
  const mp=D.projects.filter(p=>p.cls===name),mxs=maxSum();
  const bs=[];
  if(lead('week'))bs.push(['🥇',t('bd_lw')]);
  if(lead('month'))bs.push(['🏅',t('bd_lm')]);
  if(lead('year'))bs.push(['🏆',t('bd_ly')]);
  if(num(c.weekCount)>=num(D.settings.weekMin))bs.push(['🔥',t('bd_act')]);
  if(mp.length>=5)bs.push(['📸',t('bd_ph')]);
  if(mxs&&mp.some(p=>p.total>=mxs*.8))bs.push(['⭐',t('bd_top')]);
  body.append(bs.length?h('div',{class:'badges'},bs.map(([i,l])=>h('div',{class:'bdg'},h('span',{text:i}),l))):h('div',{class:'empty',style:'padding:18px',text:t('no_badges')}));
  // история
  body.append(h('h4',{class:'sech',text:t('prof_hist')}));
  const hist=[
    ...D.results.filter(r=>r.cls===name).map(r=>({d:r.date,n:r.task,s:r.comment,p:r.points})),
    ...mp.map(p=>({d:p.date,n:'📷 '+p.title,s:t('act_proj'),p:p.total+num(D.settings.actPerProject)})),
    ...D.bonuses.filter(b=>b.cls===name).map(b=>({d:b.date,n:'🔥 '+t('act_bonus'),s:'',p:b.points}))
  ].sort((a,b)=>new Date(b.d)-new Date(a.d)).slice(0,40);
  const hs=h('div',{class:'mini hist'});
  if(!hist.length)hs.append(h('div',{class:'empty',text:t('none')}));
  hist.forEach(x=>hs.append(h('div',{class:'mi'},h('div',{class:'g'},x.n,h('small',{text:fmtDate(x.d)+(x.s?' · '+x.s:'')})),h('b',{style:'color:'+(x.p<0?'var(--red)':'var(--g2)'),text:(x.p>0?'+':'')+fmt(x.p)}))));
  body.append(hs);
  // проекты
  if(mp.length){
    body.append(h('h4',{class:'sech',text:t('prof_proj')}));
    body.append(h('div',{class:'pgal'},mp.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(p=>thumb(p,300))));
  }
  const acts=h('div',{class:'acts',style:'margin-top:24px'},
    h('button',{class:'btn gold sm',text:t('send'),onclick:()=>{closeAll();openSend(name)}}));
  if(myCls!==name)acts.append(h('button',{class:'btn sec2 sm',text:t('make_my'),onclick:()=>{setMy(name);closeAll()}}));
  body.append(acts);
  openM('#mClass');
}

function resetSend(full=true){
  sendData='';$('#sFile').value='';$('#pvWrap').classList.add('hidden');$('#dz').classList.remove('hidden');
  if(full){$('#sTitle').value='';$('#sDesc').value='';$('#sAuthor').value='';$('#dCnt').textContent='0'}
  $('#sSubmit').disabled=false;$('#sSubmit').textContent=t('s_submit');
}
$$('.js-send').forEach(b=>b.onclick=()=>openSend());
$('#sDesc').addEventListener('input',e=>$('#dCnt').textContent=e.target.value.length);
const drop=$('#drop');
drop.onclick=()=>{if(!sendData)$('#sFile').click()};
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)takeFile(f)});
$('#sFile').onchange=e=>{const f=e.target.files[0];if(f)takeFile(f)};
$('#pvX').onclick=e=>{e.stopPropagation();sendData='';$('#sFile').value='';$('#pvWrap').classList.add('hidden');$('#dz').classList.remove('hidden')};
async function takeFile(f){
  if(!f.type.startsWith('image/')){toast(t('bad_img'),true);return}
  try{
    sendData=await compress(f);
    $('#pvImg').src=sendData;$('#pvWrap').classList.remove('hidden');$('#dz').classList.add('hidden');
  }catch(e){toast(e.message||t('bad_img'),true)}
}
function compress(file,maxSide=1600,q=.82){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const k=Math.min(1,maxSide/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',q));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error(t('bad_img')))};
    img.src=url;
  });
}
$('#sendForm').onsubmit=async e=>{
  e.preventDefault();
  const cls=$('#sClass').value,title=$('#sTitle').value.trim();
  if(!cls||!title){toast(t('s_need'),true);return}
  if(!sendData){toast(t('s_need_photo'),true);return}
  const btn=$('#sSubmit');btn.disabled=true;btn.textContent=t('s_sending');
  try{
    await api('submit',{class:cls,title,description:$('#sDesc').value.trim(),author:$('#sAuthor').value.trim(),image:sendData,website:$('#hp').value});
    if(!myCls){myCls=cls;localStorage.setItem('eco_my',cls);renderMy()}
    $('#sendWrap').classList.add('hidden');$('#sendDone').classList.remove('hidden');
    resetSend(true);
    if(token)loadPending(true).then(renderAdmin);
  }catch(err){toast(err.message||t('err'),true);btn.disabled=false;btn.textContent=t('s_submit')}
};
$('#sAgain').onclick=()=>{$('#sendWrap').classList.remove('hidden');$('#sendDone').classList.add('hidden')};

function paintAdmin(){document.body.classList.toggle('is-admin',!!token);$('#adm').firstChild.textContent=token?'🚪':'🔐';if(!token)$('#admBadge').classList.add('hidden')}
$('#adm').onclick=()=>{
  if(token){logout();return}
  $('#pw').value='';openM('#mLogin');setTimeout(()=>$('#pw').focus(),250);
};
function logout(silent){token='';D.pending=[];sessionStorage.removeItem('eco_token');paintAdmin();if(!silent)toast(t('logged_out'))}
$('#fLogin').onsubmit=async e=>{
  e.preventDefault();
  if(NO_API){toast(t('setup_title'),true);return}
  const btn=e.target.querySelector('button');btn.disabled=true;
  try{
    const j=await api('login',{password:$('#pw').value});
    token=j.token;sessionStorage.setItem('eco_token',token);paintAdmin();
    await loadPending(true);
    closeM($('#mLogin'));toast(t('logged_in'));render();
    setTimeout(()=>$('#admin').scrollIntoView({behavior:'smooth'}),300);
  }catch(err){toast(err.message,true)}
  btn.disabled=false;
};
$('#admTabs').addEventListener('click',e=>{
  const b=e.target.closest('[data-tab]');if(!b)return;
  $$('#admTabs button').forEach(x=>x.classList.toggle('on',x===b));
  $$('.tabpane').forEach(p=>p.classList.toggle('hidden',p.id!=='tab-'+b.dataset.tab));
});

let rulesDirty=false;
['kAct','kMin','kBon','kQ'].forEach(id=>$('#'+id).addEventListener('input',()=>{rulesDirty=true;ruleExample()}));
function ruleExample(){
  const a=num($('#kAct').value),m=Math.max(1,num($('#kMin').value)),b=num($('#kBon').value),n=Math.max(4,m);
  $('#ruleEx').textContent=tf('r_example',{n,a,b,s:n*a+b});
}

function renderAdmin(){
  if(!token)return;
  // счётчик заявок
  const pc=D.pending.length;
  $('#pcnt').textContent=pc;$('#pcnt').classList.toggle('zero',!pc);
  const ab=$('#admBadge');ab.textContent=pc;ab.classList.toggle('hidden',!pc);
  // очередь
  const pl=$('#pendList');pl.innerHTML='';
  if(!pc)pl.append(h('div',{class:'empty',style:'grid-column:1/-1',text:t('no_pending')}));
  D.pending.forEach((p,i)=>pl.append(h('div',{class:'pcard',style:`animation-delay:${i*.05}s`},
    h('div',{class:'pim',onclick:()=>openReview(p,true)},h('img',{src:imgUrl(p.fileId,600),loading:'lazy',alt:'',referrerpolicy:'no-referrer'}),h('span',{class:'cb',text:p.cls})),
    h('div',{class:'pb2'},h('b',{text:p.title}),h('p',{text:p.desc||'—'}),h('small',{text:fmtDate(p.date)+(p.author?' · '+t('from')+' '+p.author:'')}),
      h('div',{class:'acts'},
        h('button',{class:'btn sm',text:t('review'),onclick:()=>openReview(p,true)}),
        h('button',{class:'btn sec2 sm',text:t('reject'),onclick:()=>{if(confirm(t('confirm_rej')))act(async()=>{await api('rejectProject',{id:p.id});await loadPending(true)})}}))))));
  // форма баллов
  const rc=$('#rClass'),cur=rc.value;rc.innerHTML='';
  D.classes.slice().sort(clsSort).forEach(c=>rc.append(h('option',{value:c.name,text:c.name})));
  if(cur)rc.value=cur;
  const dl=$('#taskList');dl.innerHTML='';D.tasks.forEach(x=>dl.append(h('option',{value:x})));
  const lr=$('#lastRes');lr.innerHTML='';
  const last=D.results.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,15);
  if(!last.length)lr.append(h('div',{class:'empty',text:t('none')}));
  last.forEach(r=>lr.append(h('div',{class:'mi'},
    h('div',{class:'g'},r.cls+' · '+r.task,h('small',{text:fmtDate(r.date)})),
    h('b',{style:'color:'+(r.points<0?'var(--red)':'var(--g2)'),text:(r.points>0?'+':'')+fmt(r.points)}),
    h('button',{class:'x',text:'✕',onclick:()=>{if(confirm(t('confirm_del')))act(()=>api('deleteResult',{id:r.id}))}}))));
  // классы
  const ct=$('#clsTags');ct.innerHTML='';
  D.classes.slice().sort(clsSort).forEach(c=>ct.append(h('span',{class:'tag'},c.name,
    h('button',{class:'x',text:'✕',onclick:()=>{if(confirm(t('confirm_del')+' '+c.name))act(()=>api('deleteClass',{name:c.name}))}}))));
  // критерии
  const cl=$('#critList');cl.innerHTML='';
  if(!D.criteria.length)cl.append(h('div',{class:'empty',text:t('no_crit')}));
  D.criteria.forEach(c=>cl.append(h('div',{class:'mi'},h('div',{class:'g'},lang==='uz'?c.uz:c.ru,h('small',{text:lang==='uz'?c.ru:c.uz})),h('b',{text:'max '+c.max}),
    h('button',{class:'x',text:'✕',onclick:()=>{if(confirm(t('confirm_del')))act(()=>api('deleteCriterion',{id:c.id}))}}))));
  // правила
  if(!rulesDirty){
    $('#kAct').value=D.settings.actPerProject;$('#kMin').value=D.settings.weekMin;$('#kBon').value=D.settings.weekBonus;$('#kQ').checked=!!D.settings.qualityInRating;
    ruleExample();
  }
}
$('#fRes').onsubmit=async e=>{
  e.preventDefault();
  const cls=$('#rClass').value,task=$('#rTask').value.trim(),points=num($('#rPts').value),comment=$('#rCom').value.trim();
  if(!cls||!task)return;
  if(await act(()=>api('addResult',{class:cls,task,points,comment}))){$('#rPts').value='';$('#rCom').value=''}
};
$('#fClass').onsubmit=async e=>{
  e.preventDefault();const name=$('#cName').value.trim();if(!name)return;
  if(await act(()=>api('addClass',{name})))$('#cName').value='';
};
$('#fCrit').onsubmit=async e=>{
  e.preventDefault();
  const name_ru=$('#kRu').value.trim(),name_uz=$('#kUz').value.trim(),max=num($('#kMax').value)||10;
  if(await act(()=>api('addCriterion',{name_ru,name_uz,max}))){$('#kRu').value='';$('#kUz').value='';$('#kMax').value=10}
};
$('#fRules').onsubmit=async e=>{
  e.preventDefault();
  const ok=await act(()=>api('saveSettings',{ACT_PER_PROJECT:num($('#kAct').value),WEEK_MIN:num($('#kMin').value),WEEK_BONUS:num($('#kBon').value),QUALITY_IN_RATING:$('#kQ').checked?1:0}));
  if(ok)rulesDirty=false;
};

/* ---- проверка заявки / оценка ---- */
let rv=null;
function openReview(p,isPending){
  if(!token){openM('#mLogin');return}
  rv={p,isPending};
  $('#rvImg').src=imgUrl(p.fileId,1600);
  $('#rvTitle').textContent=p.title||'—';
  $('#rvMeta').textContent=p.cls+' · '+fmtDate(p.date)+(p.author?' · '+t('from')+' '+p.author:'');
  $('#rvDesc').textContent=p.desc||'';
  const box=$('#rcList');box.innerHTML='';
  if(!D.criteria.length)box.append(h('div',{class:'empty',text:t('no_crit')}));
  D.criteria.forEach(c=>{
    const init=num((p.scores||{})[c.id]);
    const out=h('output',{text:init+' / '+c.max});
    const inp=h('input',{type:'range',min:0,max:c.max,step:1,value:init,'data-id':c.id,oninput:e=>{out.textContent=e.target.value+' / '+c.max;sumRate()}});
    box.append(h('div',{class:'crit'},h('div',{class:'top2'},h('span',{text:lang==='uz'?c.uz:c.ru}),out),inp));
  });
  sumRate();
  $('#rvOk').textContent=isPending?'✅ '+t('approve'):t('r_save');
  $('#rvNo').classList.toggle('hidden',!isPending);
  $('#rvDel').classList.toggle('hidden',!isPending);
  openM('#mReview');
}
function sumRate(){
  const tot=$$('#rcList input').reduce((a,i)=>a+num(i.value),0);
  $('#rcSum').textContent=tot+' / '+maxSum();
}
$('#rvOk').onclick=async()=>{
  if(!rv)return;
  const scores={};$$('#rcList input').forEach(i=>scores[i.dataset.id]=num(i.value));
  const ok=await act(async()=>{await api('reviewProject',{id:rv.p.id,scores});await loadPending(true)});
  if(ok)closeM($('#mReview'));
};
$('#rvNo').onclick=async()=>{
  if(!rv||!confirm(t('confirm_rej')))return;
  if(await act(async()=>{await api('rejectProject',{id:rv.p.id});await loadPending(true)}))closeM($('#mReview'));
};
$('#rvDel').onclick=async()=>{
  if(!rv||!confirm(t('confirm_del')))return;
  if(await act(async()=>{await api('deleteProject',{id:rv.p.id});await loadPending(true)}))closeM($('#mReview'));
};

const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.06});
$$('.reveal').forEach(e=>io.observe(e));
const spy=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting)$$('#menu a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+x.target.id))}),{rootMargin:'-45% 0px -50% 0px'});
['leaders','rating','my','projects','activity'].forEach(id=>spy.observe($('#'+id)));
addEventListener('scroll',()=>$('#hdr').classList.toggle('sc',scrollY>20),{passive:true});

let introDone=false;
function endIntro(){
  if(introDone)return;introDone=true;
  const i=$('#intro');i.classList.add('hide');
  setTimeout(()=>i.remove(),1000);
}
$('#skip').onclick=e=>{e.stopPropagation();endIntro()};
setTimeout(endIntro,6600);
