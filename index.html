<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EkoSchool · 153 — Reyting</title>
<meta name="theme-color" content="#06281a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f4faf2; --ink:#0d2b1d; --muted:#4d6b5b;
  --g900:#06281a; --g800:#0b3d2a; --g700:#12603c; --g600:#1a8a50; --g500:#2fb86a; --g400:#5fdb8d;
  --lime:#c6f56f; --sun:#ffd166; --red:#d64545;
  --radius:26px; --shadow:0 20px 50px -22px rgba(6,40,26,.4);
  --head:'Unbounded','Manrope',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.container{width:min(1100px,92%);margin:auto}
section{scroll-margin-top:70px}
.section{padding:90px 0;position:relative}
.tag{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:99px;background:rgba(47,184,106,.14);color:var(--g700);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
h2.title{font-family:var(--head);font-weight:800;font-size:clamp(26px,3.6vw,40px);line-height:1.15;margin:16px 0 12px;letter-spacing:-.02em}
.sub-t{color:var(--muted);max-width:620px;font-size:17px}
.center{text-align:center}.center .sub-t{margin:auto}
.grad{background:linear-gradient(90deg,var(--g400),var(--lime),var(--sun));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 100%;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}

/* ============ INTRO (без изменений) ============ */
#intro{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,#0f5a39 0%,#07301f 55%,#031a11 100%);
  clip-path:circle(150% at 50% 50%);-webkit-clip-path:circle(150% at 50% 50%);
  transition:clip-path 1s cubic-bezier(.7,0,.2,1),-webkit-clip-path 1s cubic-bezier(.7,0,.2,1)}
#intro.done{clip-path:circle(0% at 50% 50%);-webkit-clip-path:circle(0% at 50% 50%)}
.pt{position:absolute;bottom:-20px;width:8px;height:8px;border-radius:0 100% 0 100%;background:rgba(120,255,170,.5);animation:ptUp linear infinite}
@keyframes ptUp{to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
.stage{position:relative;width:380px;height:380px;transform-origin:center}
@media(max-width:430px){.stage{transform:scale(.78)}}
.ring{position:absolute;inset:0;width:100%;height:100%}
.ring circle{fill:none;stroke:url(#ringG);stroke-width:3;stroke-linecap:round;stroke-dasharray:1100;stroke-dashoffset:1100;transform:rotate(-90deg);transform-origin:50% 50%;animation:draw 1.2s 2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.glow{position:absolute;left:50%;top:50%;width:320px;height:320px;margin:-160px 0 0 -160px;border-radius:50%;background:radial-gradient(circle,rgba(120,255,160,.5),transparent 65%);opacity:0;animation:glow 1.6s 2s ease-out forwards}
@keyframes glow{0%{opacity:0;transform:scale(.3)}40%{opacity:1}100%{opacity:.35;transform:scale(1.25)}}
.pair{position:absolute;inset:0;animation:lift .9s 2.6s cubic-bezier(.6,0,.2,1) forwards}
@keyframes lift{to{transform:translateY(-78px) scale(.6)}}
.leaf{position:absolute;left:50%;top:88px;width:110px;height:165px;margin-left:-55px;transform-origin:50% 100%;opacity:0;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.leaf svg{width:100%;height:100%;overflow:visible}
.leaf.a{animation:fallA 1.9s .2s cubic-bezier(.45,.05,.35,1) forwards}
.leaf.b{animation:fallB 1.9s .45s cubic-bezier(.45,.05,.35,1) forwards}
@keyframes fallA{0%{opacity:0;transform:translate(-210px,-380px) rotate(-200deg)}10%{opacity:1}40%{transform:translate(90px,-200px) rotate(40deg)}70%{transform:translate(-50px,-60px) rotate(-70deg)}100%{opacity:1;transform:translate(0,0) rotate(-38deg)}}
@keyframes fallB{0%{opacity:0;transform:translate(210px,-380px) rotate(200deg)}10%{opacity:1}40%{transform:translate(-90px,-200px) rotate(-40deg)}70%{transform:translate(50px,-60px) rotate(70deg)}100%{opacity:1;transform:translate(0,0) rotate(38deg)}}
.stem{position:absolute;left:50%;top:250px;width:6px;margin-left:-3px;height:0;border-radius:3px;background:linear-gradient(#7be495,#2fb86a);animation:stem .5s 2.1s ease forwards}
@keyframes stem{to{height:48px}}
.num{position:absolute;left:0;right:0;top:214px;display:flex;justify-content:center;font:800 100px/1 var(--head)}
.num span{display:inline-block;opacity:0;transform:translateY(40px) scale(.6);filter:blur(12px);
  background:linear-gradient(180deg,#fff,#b6f36b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:digit .9s cubic-bezier(.2,.9,.2,1.2) forwards}
.num span:nth-child(1){animation-delay:3.05s}.num span:nth-child(2){animation-delay:3.2s}.num span:nth-child(3){animation-delay:3.35s}
@keyframes digit{to{opacity:1;transform:none;filter:blur(0)}}
.isub{position:absolute;left:0;right:0;top:322px;text-align:center;color:#a8e8bf;font:700 14px var(--body);opacity:0;animation:subIn 1s 3.75s ease forwards}
@keyframes subIn{from{letter-spacing:.9em;opacity:0}to{letter-spacing:.42em;opacity:1}}

/* ============ HEADER ============ */
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;color:#fff;transition:.4s}
.hdr .in{display:flex;align-items:center;justify-content:space-between;height:74px;gap:12px}
.hdr.scrolled{background:rgba(255,255,255,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--ink);box-shadow:0 8px 30px -12px rgba(6,40,26,.25)}
.hdr.scrolled .in{height:62px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:800;font-size:19px}
.logo svg{width:34px;height:34px}
.logo b{background:linear-gradient(135deg,var(--g500),var(--g700));color:#fff;border-radius:8px;padding:1px 8px;font-size:13px}
nav ul{display:flex;gap:6px;list-style:none}
nav a{display:block;padding:8px 14px;border-radius:99px;font-weight:600;font-size:14.5px;opacity:.9;transition:.25s}
nav a:hover,nav a.act{background:rgba(47,184,106,.2);opacity:1}
.tools{display:flex;gap:10px;align-items:center}
.lang{display:flex;position:relative;background:rgba(255,255,255,.16);border-radius:99px;padding:3px;border:1px solid rgba(255,255,255,.25)}
.hdr.scrolled .lang{background:rgba(6,40,26,.07);border-color:rgba(6,40,26,.1)}
.lang button{position:relative;z-index:1;padding:6px 13px;font-weight:800;font-size:12.5px;border-radius:99px;transition:.3s}
.lang .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:linear-gradient(135deg,var(--g500),var(--g600));border-radius:99px;transition:transform .35s cubic-bezier(.5,1.5,.5,1);box-shadow:0 4px 12px rgba(47,184,106,.5)}
.lang[data-l=ru] .pill{transform:translateX(100%)}
.lang button.on{color:#fff}
.snd,.admbtn{height:40px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);transition:.3s;display:grid;place-items:center}
.snd{width:40px;font-size:17px;border-radius:50%}
.admbtn{padding:0 16px;font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:6px}
.hdr.scrolled .snd,.hdr.scrolled .admbtn{background:rgba(6,40,26,.07);border-color:rgba(6,40,26,.1)}
.snd:hover,.admbtn:hover{transform:translateY(-2px) scale(1.05)}
.admbtn.on{background:linear-gradient(135deg,var(--g500),var(--g600));color:#fff;border-color:transparent}
#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:200;background:linear-gradient(90deg,var(--g400),var(--lime),var(--sun))}

/* ============ HERO ============ */
.hero{position:relative;color:#fff;overflow:hidden;padding:140px 0 150px;text-align:center;
  background:radial-gradient(1000px 600px at 80% 0%,#14774a 0%,transparent 60%),linear-gradient(160deg,#06281a 0%,#0b3d2a 55%,#0f5a39 100%)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.5px);background-size:30px 30px;mask-image:linear-gradient(#000,transparent 85%);-webkit-mask-image:linear-gradient(#000,transparent 85%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:floaty 9s ease-in-out infinite}
.blob.b1{width:380px;height:380px;background:#2fb86a;top:-80px;left:-100px}
.blob.b2{width:320px;height:320px;background:#0099b5;bottom:-60px;right:8%;opacity:.3;animation-delay:-3s}
.blob.b3{width:220px;height:220px;background:#ffd166;top:30%;left:55%;opacity:.14;animation-delay:-5s}
@keyframes floaty{50%{transform:translateY(-18px)}}
.hero .wrap{position:relative;z-index:2}
.badge{display:inline-flex;gap:10px;align-items:center;padding:9px 18px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);font-weight:600;font-size:14px}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--lime);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,245,111,.7)}70%{box-shadow:0 0 0 12px rgba(198,245,111,0)}100%{box-shadow:0 0 0 0 rgba(198,245,111,0)}}
.hero h1{font-family:var(--head);font-weight:800;font-size:clamp(34px,6vw,66px);line-height:1.08;margin:22px 0 18px;letter-spacing:-.03em}
.hero p.lead{font-size:clamp(16px,1.6vw,19px);max-width:600px;margin:auto;color:#cfeedd}
.hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:44px;text-align:center}
.hs{padding:22px 12px;border-radius:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);transition:.35s}
.hs:hover{transform:translateY(-6px);background:rgba(255,255,255,.14)}
.hs b{display:block;font:800 clamp(24px,3.4vw,38px)/1.1 var(--head);color:var(--lime)}
.hs span{font-size:13.5px;font-weight:600;color:#bfe9d0}
.livebar{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap;font-size:14px;font-weight:600}
.live{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.1)}
.live i{width:9px;height:9px;border-radius:50%;background:#ffb020}
.live.ok i{background:var(--g400);animation:pulse 2s infinite}
.live.bad i{background:#ff6b6b}
.rf{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);transition:.4s;font-size:16px}
.rf:hover{background:rgba(255,255,255,.25)}
.rf.spin{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.rise{opacity:0;transform:translateY(30px)}
body.ready .rise{animation:rise .9s var(--d,0s) cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.wave{position:absolute;bottom:-1px;left:0;width:100%;height:100px;z-index:2}
.wave path{fill:var(--bg)}
.wave .w1{opacity:.4;animation:wv 9s ease-in-out infinite alternate}.wave .w2{opacity:.7;animation:wv 6s ease-in-out infinite alternate-reverse}
@keyframes wv{to{transform:translateX(-60px)}}

/* ============ REVEAL ============ */
.rv{opacity:0;transform:translateY(36px);transition:opacity .8s var(--d,0s) ease,transform .8s var(--d,0s) cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}

/* ============ PODIUM ============ */
.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:14px;align-items:end;max-width:780px;margin:70px auto 50px}
.pd{position:relative;text-align:center;border-radius:26px 26px 10px 10px;padding:30px 10px 22px;box-shadow:var(--shadow);cursor:pointer;transition:filter .3s;animation:pdIn .9s var(--d) cubic-bezier(.2,.9,.2,1.1) backwards}
.pd:hover{filter:brightness(1.07)}
@keyframes pdIn{from{opacity:0;transform:translateY(70px)}}
.pd.p1{min-height:260px;background:linear-gradient(160deg,#ffe08a,#e8a000);color:#4a3200}
.pd.p2{min-height:215px;background:linear-gradient(160deg,#e3eaee,#8fa3ad);color:#1f3340}
.pd.p3{min-height:185px;background:linear-gradient(160deg,#eab27a,#b96f33);color:#3a1d07}
.pd .md{font-size:46px;line-height:1.1;display:block}
.pd .cn{font:800 clamp(22px,4vw,36px) var(--head);margin:6px 0 2px;word-break:break-word}
.pd .pp{font-weight:800;font-size:17px;opacity:.85}
.pd .crown{position:absolute;top:-38px;left:50%;margin-left:-22px;font-size:44px;animation:crown 2.4s ease-in-out infinite}
@keyframes crown{50%{transform:translateY(-8px) rotate(6deg)}}

/* ============ RATING LIST ============ */
.toolbar{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:40px 0 22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:99px;font-weight:800;font-size:14px;background:#fff;border:1px solid rgba(47,184,106,.25);transition:.25s}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:linear-gradient(135deg,var(--g500),var(--g700));color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px rgba(26,138,80,.8)}
input,select,textarea{width:100%;padding:14px 18px;border-radius:16px;border:2px solid #dcebe1;background:#f6fbf7;font:600 15.5px var(--body);color:var(--ink);transition:.3s;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--g500);background:#fff;box-shadow:0 0 0 5px rgba(47,184,106,.15)}
.search{max-width:260px;padding:11px 18px;background:#fff}
.list{display:grid;gap:12px}
.row{width:100%;display:grid;grid-template-columns:54px 1fr auto;gap:16px;align-items:center;padding:16px 22px;background:#fff;border-radius:20px;border:1px solid rgba(47,184,106,.14);box-shadow:0 10px 28px -22px rgba(6,40,26,.5);text-align:left;transition:transform .3s,box-shadow .3s,border-color .3s;animation:rowIn .6s calc(var(--i)*45ms) cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rowIn{from{opacity:0;transform:translateY(22px)}}
.row:hover{transform:translateX(8px);border-color:var(--g500);box-shadow:0 18px 36px -18px rgba(6,40,26,.5)}
.rk{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:800 17px var(--head);background:#e4f5e9;color:var(--g700)}
.rk.r1{background:linear-gradient(135deg,#ffe08a,#e8a000);color:#4a3200;font-size:24px}
.rk.r2{background:linear-gradient(135deg,#e3eaee,#8fa3ad);color:#1f3340;font-size:24px}
.rk.r3{background:linear-gradient(135deg,#eab27a,#b96f33);color:#3a1d07;font-size:24px}
.nm b{font:800 19px var(--head)}
.nm small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.bar{height:8px;border-radius:8px;background:#e4f2e8;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--g400),var(--lime));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.pts{text-align:right;font:800 24px var(--head);color:var(--g700);line-height:1.1}
.pts small{display:block;font:700 12px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pts.neg{color:var(--red)}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-weight:600;background:#fff;border-radius:22px;border:2px dashed #cfe6d6}
.empty .e{font-size:50px;display:block;animation:floaty 4s ease-in-out infinite}
.sk{height:84px;border-radius:20px;background:linear-gradient(90deg,#e6f1e9 25%,#f4faf5 50%,#e6f1e9 75%);background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}
.errbox{text-align:center;padding:40px 20px;border-radius:22px;background:#fff4f4;border:2px solid #f3c9c9;color:#8a2d2d;font-weight:700}
.errbox .btn{margin-top:16px}

/* ============ BUTTONS ============ */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 28px;border-radius:99px;font-weight:800;font-size:15px;transition:transform .3s,box-shadow .3s,opacity .3s}
.btn.solid{background:linear-gradient(135deg,var(--g500),var(--g700));color:#fff;box-shadow:0 14px 30px -12px rgba(26,138,80,.9)}
.btn.ghost{background:#eaf6ee;color:var(--g700)}
.btn:hover{transform:translateY(-3px)}
.btn:disabled{opacity:.55;pointer-events:none}

/* ============ FEED ============ */
.feed-sec{background:linear-gradient(180deg,var(--bg),#e6f6e8)}
.feed{display:grid;gap:12px;max-width:820px;margin:44px auto 0}
.fi{display:grid;grid-template-columns:48px 1fr auto;gap:16px;align-items:center;background:#fff;padding:16px 20px;border-radius:20px;box-shadow:0 10px 26px -22px rgba(6,40,26,.5);border:1px solid rgba(47,184,106,.12);animation:rowIn .6s calc(var(--i)*60ms) backwards}
.fi .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,#dcf8e6,#c6f56f66)}
.fi b{font-weight:800}
.fi small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.fi .pl{font:800 19px var(--head);color:var(--g600)}.fi .pl.neg{color:var(--red)}

/* ============ ADMIN ============ */
.admin-sec{background:linear-gradient(135deg,var(--g900),var(--g700));color:#fff;overflow:hidden}
.admin-sec::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 15%,rgba(95,219,141,.22),transparent 40%),radial-gradient(circle at 90% 85%,rgba(0,153,181,.2),transparent 40%)}
.admin-sec .container{position:relative}
.admin-sec .tag{background:rgba(255,255,255,.12);color:var(--lime)}
.admin-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.admin-sec .btn.ghost{background:rgba(255,255,255,.12);color:#fff}
.a-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:26px;margin-top:34px}
.panel{background:#fff;color:var(--ink);border-radius:28px;padding:28px;box-shadow:0 30px 60px -25px rgba(0,0,0,.5)}
.panel h3{font:800 18px var(--head);margin-bottom:18px}
.panel form{display:grid;gap:14px}
.lbl{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:block;margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{min-height:24px;font-weight:800;color:var(--g600);font-size:15px}
.ent{max-height:430px;overflow:auto;display:grid;gap:10px;padding-right:4px}
.en{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:#f3faf5;font-size:14px}
.en b{font-weight:800}.en small{display:block;color:var(--muted);font-weight:600}
.en .pl{font:800 16px var(--head);color:var(--g600)}.en .pl.neg{color:var(--red)}
.xb{width:34px;height:34px;border-radius:50%;background:#fde8e8;color:var(--red);font-weight:800;transition:.25s}
.xb:hover{background:var(--red);color:#fff;transform:rotate(90deg)}
.xb:disabled{opacity:.3;pointer-events:none}
.cl-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.cc{display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:99px;background:#e4f5e9;font-weight:800;font-size:14px}
.cc .xb{width:26px;height:26px;font-size:12px}
.inline{display:flex;gap:10px}.inline input{flex:1}

/* ============ MODAL ============ */
.modal{position:fixed;inset:0;z-index:500;background:rgba(3,26,17,.7);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:.4s}
.modal.open{opacity:1;pointer-events:auto}
.mp{position:relative;width:min(560px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:30px;padding:34px 30px;transform:translateY(40px) scale(.95);transition:.5s cubic-bezier(.2,.9,.2,1.1)}
.modal.open .mp{transform:none}
.mp h3{font:800 24px var(--head);margin-bottom:6px;padding-right:40px}
.mp .sub{color:var(--muted);font-weight:600;margin-bottom:20px}
.mp form{display:grid;gap:14px;margin-top:18px}
.mx{position:absolute;top:16px;right:16px;width:42px;height:42px;border-radius:50%;background:#eef6f0;font-size:18px;font-weight:800;transition:.3s}

footer{background:#031a11;color:#8fb9a2;text-align:center;padding:38px 0 32px;font-size:15px}

.lf{position:fixed;z-index:9000;pointer-events:none;font-size:var(--s,16px);animation:lfly .9s ease-out forwards}

const $=id=>document.getElementById(id);

const t=k=>(I18N[lang][k]??k);
const S={data:null,filter:'all',q:'',token:sessionStorage.getItem('tok'),busy:false,sig:'',openClass:null};
const fmtNum=v=>(Math.round(v*100)/100).toLocaleString('ru-RU');
const fmtTime=iso=>{const d=new Date(iso); if(isNaN(d)) return iso; return d.toLocaleString(lang==='ru'?'ru-RU':'uz-UZ',{timeZone:'Asia/Tashkent',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});};
const gradeOf=n=>{const g=parseInt(n,10); return isNaN(g)?'—':String(g);};
function animNum(node,to){ const from=+node.dataset.v||0; node.dataset.v=to; const t0=performance.now(),dur=900;
  (function f(n){const p=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-p,3); node.textContent=fmtNum(from+(to-from)*e); if(p<1) requestAnimationFrame(f);})(t0); }

/* ===================== SOUND ===================== */
let actx=null, soundOn=localStorage.getItem('snd')!=='off';
function ctx(){ if(!actx){const AC=window.AudioContext||window.webkitAudioContext; if(AC) actx=new AC();} if(actx&&actx.state==='suspended') actx.resume(); return actx; }
function tone(f,t0,d,type='sine',v=.12,f2){
  const c=actx,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+d+.03);
}
function sClick(){ if(!soundOn) return; const c=ctx(); if(!c) return; const n=c.currentTime; tone(620,n,.13,'sine',.11,940); tone(1320,n+.025,.18,'triangle',.045,1760); tone(2093,n+.05,.2,'sine',.02); }
function sGood(){ if(!soundOn||!ctx()) return; const n=actx.currentTime+.08; [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,n+i*.08,.3,'sine',.1)); }
function sBad(){ if(!soundOn||!ctx()) return; const n=actx.currentTime+.08; tone(240,n,.22,'triangle',.12,150); tone(180,n+.12,.25,'triangle',.1,110); }
const sndBtn=$('snd');
const sndUI=()=>sndBtn.textContent=soundOn?'🔊':'🔇';
sndBtn.addEventListener('click',()=>{soundOn=!soundOn; localStorage.setItem('snd',soundOn?'on':'off'); sndUI();});
sndUI();

function burst(x,y,n=5,emo='🍃'){
  for(let i=0;i<n;i++){
    const s=el('span','lf',emo), a=Math.random()*Math.PI*2, d=40+Math.random()*60;
    s.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-20}px;--r:${Math.random()*360-180}deg;--s:${12+Math.random()*12}px`;
    document.body.appendChild(s); setTimeout(()=>s.remove(),950);
  }
}
document.addEventListener('click',e=>{
  sClick();
  const r=el('div','rip'); r.style.left=e.clientX+'px'; r.style.top=e.clientY+'px';
  document.body.appendChild(r); setTimeout(()=>r.remove(),750);
  burst(e.clientX,e.clientY,4);
});

function toast(msg,bad){ const T=$('toast'); T.textContent=msg; T.classList.toggle('bad',!!bad); T.classList.add('show'); clearTimeout(T._t); T._t=setTimeout(()=>T.classList.remove('show'),3600); }

/* ===================== INTRO ===================== */
(function(){
  const intro=$('intro');
  for(let i=0;i<18;i++){const p=el('span','pt');p.style.left=Math.random()*100+'%';p.style.animationDuration=(5+Math.random()*6)+'s';p.style.animationDelay=(-Math.random()*8)+'s';p.style.opacity=.3+Math.random()*.6;p.style.transform=`scale(${.6+Math.random()*1.2})`;intro.appendChild(p);}
  setTimeout(()=>{ intro.classList.add('done'); document.body.classList.remove('lock'); document.body.classList.add('ready'); setTimeout(()=>intro.remove(),1200); },5300);

/* ===================== HEADER / SCROLL / REVEAL ===================== */
const hdr=$('hdr'),prog=$('progress');
function onScroll(){ const y=scrollY,h=document.documentElement.scrollHeight-innerHeight; hdr.classList.toggle('scrolled',y>40); prog.style.width=(h>0?y/h*100:0)+'%'; }
addEventListener('scroll',onScroll,{passive:true}); onScroll();
const revObs=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in'); revObs.unobserve(en.target);}}),{threshold:.12});
document.querySelectorAll('.rv').forEach(n=>revObs.observe(n));
const links=[...document.querySelectorAll('nav a')];
const secObs=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting) links.forEach(a=>a.classList.toggle('act',a.getAttribute('href')==='#'+en.target.id));}),{rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('section[id]').forEach(s=>secObs.observe(s));

/* ===================== API (Google Apps Script ⇄ Google Sheets) ===================== */
async function api(action,payload={}){
  const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action,token:S.token,...payload})}); // text/plain: без preflight
  const d=await r.json();
  if(!d.ok) throw new Error(d.error||'server_error');
  return d;
}
function setLive(state){
  S.live=state; const L=$('live'); L.classList.remove('ok','bad');
  if(state===true) L.classList.add('ok'); if(state===false) L.classList.add('bad');
  $('liveTx').textContent=state===true?t('live_ok'):state===false?t('live_bad'):t('live_wait');
}
function updTime(){ $('updTx').textContent=S.data?`${t('upd')}: ${fmtTime(S.data.updated)}`:''; }

async function load(manual){
  if(!API_READY) return;
  const rf=$('rf'); if(manual) rf.classList.add('spin');
  try{
    const r=await fetch(API_URL+'?action=data&_='+Date.now(),{cache:'no-store'});
    const d=await r.json(); if(!d.ok) throw new Error(d.error||'server_error');
    S.data=d; setLive(true); updTime(); render(false);
  }catch(e){
    setLive(false);
    if(!S.data) showError(e); else if(manual) toast(errText(e),true);
  }finally{ setTimeout(()=>rf.classList.remove('spin'),500); }
}
function errText(e){ const m=e&&e.message||''; const k='e_'+m; return I18N[lang][k]||t('err_net'); }
function showError(e){
  const box=$('list'); box.textContent='';
  const b=el('div','errbox'); b.append(el('div',null,'⚠️ '+errText(e)));
  const btn=el('button','btn solid',t('retry')); btn.onclick=()=>load(true); b.append(btn); box.append(b);
}

/* ===================== RENDER ===================== */
function render(force){
  const d=S.data; if(!d) return;
  const sig=d.classes.map(c=>c.name+':'+c.points+':'+c.count).join('|')+'#'+d.results.length+(d.results[0]?d.results[0].id:'');
  const changed=force||sig!==S.sig; S.sig=sig;
  if(changed){ renderStats(); renderPodium(); renderChips(); renderList(); renderFeed(); renderAdmin(); if(S.openClass) fillClass(S.openClass); }
}
function renderStats(){
  const d=S.data, tot=d.classes.reduce((a,c)=>a+c.points,0), top=d.classes[0];
  animNum($('sClasses'),d.classes.length); animNum($('sTotal'),tot); animNum($('sEntries'),d.results.length);
  $('sLeader').textContent=top&&top.points>0?top.name:'—';
}
function renderPodium(){
  const box=$('podium'), d=S.data, top=d.classes.filter(c=>c.points>0).slice(0,3);
  box.textContent=''; box.hidden=top.length<1; if(top.length<1) return;
  const order=top.length>=3?[1,0,2]:top.length===2?[1,0]:[0];
  order.forEach(i=>{
    const c=top[i], p=el('div','pd p'+(i+1)); p.style.setProperty('--d',(i===0?.5:i===1?.2:.35)+'s');
    if(i===0) p.append(el('span','crown','👑'));
    p.append(el('span','md',['🥇','🥈','🥉'][i]), el('div','cn',c.name), el('div','pp',fmtNum(c.points)+' '+t('pts')));
    p.onclick=()=>openClass(c.name); box.append(p);
  });
}
function renderChips(){
  const box=$('chips'), grades=[...new Set(S.data.classes.map(c=>gradeOf(c.name)))].sort((a,b)=>(+a||99)-(+b||99));
  if(S.filter!=='all'&&!grades.includes(S.filter)) S.filter='all';
  box.textContent='';
  [['all',t('all')],...grades.map(g=>[g,g])].forEach(([v,l])=>{
    const b=el('button','chip'+(S.filter===v?' on':''),l); b.onclick=()=>{S.filter=v; renderChips(); renderList();}; box.append(b);
  });
}
function renderList(){
  const box=$('list'), d=S.data; box.textContent='';
  if(!d.classes.length){ const e=el('div','empty'); e.append(el('span','e','🏫'),t('e_nocls')); box.append(e); return; }
  const max=Math.max(1,...d.classes.map(c=>c.points));
  const arr=d.classes.filter(c=>(S.filter==='all'||gradeOf(c.name)===S.filter)&&c.name.toLowerCase().includes(S.q));
  if(!arr.length){ const e=el('div','empty'); e.append(el('span','e','🔍'),t('e_nofind')); box.append(e); return; }
  if(d.results.length===0){ const e=el('div','empty'); e.style.marginBottom='8px'; e.append(el('span','e','🌱'),t('e_nores')); box.append(e); }
  arr.forEach((c,i)=>{
    const r=el('button','row'); r.style.setProperty('--i',Math.min(i,20));
    const rk=el('div','rk r'+c.rank, c.points>0&&c.rank<=3?['🥇','🥈','🥉'][c.rank-1]:c.rank);
    const nm=el('div','nm'); nm.append(el('b',null,c.name), el('small',null,c.count+' '+t('tasks')));
    const bar=el('div','bar'), fill=el('i'); bar.append(fill); nm.append(bar);
    const pts=el('div','pts'+(c.points<0?' neg':'')); const num=el('span',null,'0'); pts.append(num, el('small',null,t('pts')));
    r.append(rk,nm,pts); r.onclick=()=>openClass(c.name); box.append(r);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{fill.style.width=Math.max(0,c.points)/max*100+'%';}));
    animNum(num,c.points);
  });
}
function renderFeed(){
  const box=$('feed'), arr=S.data.results.slice(0,8); box.textContent='';
  if(!arr.length){ box.append(el('div','empty',t('a_empty'))); return; }
  arr.forEach((r,i)=>{
    const it=el('div','fi'); it.style.setProperty('--i',i);
    const mid=el('div'); mid.append(el('b',null,r.cls+' — '+r.task));
    mid.append(el('small',null,(r.comment?r.comment+' · ':'')+fmtTime(r.date)));
    it.append(el('div','ic',r.points<0?'⚠️':'🌿'), mid, el('div','pl'+(r.points<0?' neg':''),(r.points>0?'+':'')+fmtNum(r.points)));
    box.append(it);
  });
}

/* ===================== CLASS HISTORY MODAL ===================== */
function openClass(name){ S.openClass=name; fillClass(name); openModal('mClass'); }
function fillClass(name){
  const c=S.data.classes.find(x=>x.name===name); if(!c) return;
  $('mcName').textContent=c.name;
  const tot=$('mcTot'); tot.textContent='';
  [[fmtNum(c.points),t('h_total')],['#'+c.rank,t('h_rank')],[c.count,t('h_count')]].forEach(([v,l])=>{const d=el('div'); d.append(el('b',null,v),el('span',null,l)); tot.append(d);});
  const box=$('mcList'); box.textContent='';
  const rs=S.data.results.filter(r=>r.cls===name);
  if(!rs.length){ box.append(el('div','empty',t('h_empty'))); return; }
  rs.forEach(r=>{
    const e=el('div','en'), m=el('div'); m.append(el('b',null,r.task), el('small',null,(r.comment?r.comment+' · ':'')+fmtTime(r.date)));
    e.append(m, el('div','pl'+(r.points<0?' neg':''),(r.points>0?'+':'')+fmtNum(r.points))); box.append(e);
  });
}

/* ===================== MODALS ===================== */
function openModal(id){ $(id).classList.add('open'); document.body.classList.add('lock'); }
function closeModals(){ document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open')); document.body.classList.remove('lock'); S.openClass=null; }
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m||e.target.closest('[data-close]')) closeModals(); }));

/* ===================== ADMIN ===================== */
function isAdmin(){ return !!S.token; }
function adminUI(){
  $('admin').hidden=!isAdmin(); $('admBtn').classList.toggle('on',isAdmin());
  if(isAdmin()) renderAdmin();
}
function renderAdmin(){
  if(!isAdmin()||!S.data) return;
  const d=S.data, sel=$('fClass'), prev=sel.value;
  sel.textContent='';
  d.classes.slice().sort((a,b)=>a.name.localeCompare(b.name,'ru',{numeric:true})).forEach(c=>{const o=el('option',null,c.name); o.value=c.name; sel.append(o);});
  if(prev&&[...sel.options].some(o=>o.value===prev)) sel.value=prev;
  const dl=$('taskList'); dl.textContent=''; d.tasks.forEach(x=>{const o=el('option'); o.value=x; dl.append(o);});
  const en=$('entries'); en.textContent='';
  d.results.slice(0,40).forEach(r=>{
    const e=el('div','en'), m=el('div'); m.append(el('b',null,r.cls+' — '+r.task), el('small',null,(r.comment?r.comment+' · ':'')+fmtTime(r.date)));
    const x=el('button','xb','✕'); x.onclick=()=>delResult(r.id);
    e.append(m, el('div','pl'+(r.points<0?' neg':''),(r.points>0?'+':'')+fmtNum(r.points)), x); en.append(e);
  });
  if(!d.results.length) en.append(el('div','empty',t('a_empty')));
  const ch=$('clChips'); ch.textContent='';
  d.classes.slice().sort((a,b)=>a.name.localeCompare(b.name,'ru',{numeric:true})).forEach(c=>{
    const chip=el('span','cc',c.name), x=el('button','xb','✕'); x.disabled=c.count>0; x.onclick=()=>delClass(c.name); chip.append(x); ch.append(chip);
  });
  updPreview();
}
function updPreview(){
  const c=S.data&&S.data.classes.find(x=>x.name===$('fClass').value), p=parseFloat($('fPts').value), box=$('preview');
  box.textContent=(!c||isNaN(p))?'':`${c.name}: ${fmtNum(c.points)} → ${fmtNum(c.points+p)}  (${t('pv')})`;
}
['fClass','fPts'].forEach(id=>$(id).addEventListener('input',updPreview));

function logout(silent){ S.token=null; sessionStorage.removeItem('tok'); adminUI(); if(!silent) scrollTo({top:0,behavior:'smooth'}); }
function onErr(e){
  sBad();
  if(e.message==='auth'&&S.token){ logout(true); toast(t('e_auth'),true); openModal('mLogin'); return; }
  toast(errText(e),true);
}
async function mutate(action,payload,okMsg){
  if(S.busy) return false; S.busy=true;
  try{ const d=await api(action,payload); S.data=d; setLive(true); updTime(); render(true); sGood(); toast(okMsg); return true; }
  catch(e){ onErr(e); return false; }
  finally{ S.busy=false; }
}

$('admBtn').addEventListener('click',()=>{
  if(isAdmin()) $('admin').scrollIntoView({behavior:'smooth'});
  else{ $('loginErr').textContent=''; openModal('mLogin'); setTimeout(()=>$('pw').focus(),350); }
});
$('logout').addEventListener('click',()=>logout());

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); if(!API_READY){ $('loginErr').textContent=t('setup_t'); return; }
  const btn=$('loginBtn'); btn.disabled=true; $('loginErr').textContent='';
  try{
    const d=await api('login',{password:$('pw').value});
    S.token=d.token; sessionStorage.setItem('tok',d.token); $('pw').value='';
    closeModals(); adminUI(); sGood(); toast(t('ok_login'));
    setTimeout(()=>$('admin').scrollIntoView({behavior:'smooth'}),300);
  }catch(err){ sBad(); $('loginErr').textContent=errText(err); }
  finally{ btn.disabled=false; }

$('addForm').addEventListener('submit',async e=>{
  e.preventDefault(); const btn=$('addBtn'); btn.disabled=true;

  btn.disabled=false;
  if(ok){ $('fPts').value=''; $('fCom').value=''; updPreview(); const r=btn.getBoundingClientRect(); burst(r.left+r.width/2,r.top,12,'🌿'); }
});
$('classForm').addEventListener('submit',async e=>{
  e.preventDefault(); const ok=await mutate('addClass',{name:$('cName').value},t('ok_cls')); if(ok) $('cName').value='';
});
function delResult(id){ if(confirm(t('confirm_del'))) mutate('deleteResult',{id},t('ok_del')); }
function delClass(name){ if(confirm(t('confirm_cls')+' '+name)) mutate('deleteClass',{name},t('ok_clsdel')); }

/* ===================== FILTER / SEARCH / REFRESH ===================== */
$('search').addEventListener('input',e=>{ S.q=e.target.value.trim().toLowerCase(); if(S.data) renderList(); });
$('rf').addEventListener('click',()=>load(true));
setInterval(()=>{ if(!document.hidden&&!S.busy) load(false); },30000);
